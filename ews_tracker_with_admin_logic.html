<script>
// ================= ADMIN AUTH (SIMPLE VERSION) =================
const ADMIN_CREDENTIALS = {
  username: "admin",
  password: "pbssm123"
};

function loginAdmin(){
  const user = document.getElementById('a-user').value.trim();
  const pass = document.getElementById('a-pass').value.trim();
  const err = document.getElementById('a-err');

  if(user === ADMIN_CREDENTIALS.username && pass === ADMIN_CREDENTIALS.password){
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('admin-app').classList.add('show');
    loadAllAdminData();
  } else {
    err.innerText = "Invalid admin credentials";
    err.classList.add('show');
  }
}

function logoutAdmin(){
  document.getElementById('admin-app').classList.remove('show');
  document.getElementById('auth-screen').style.display = 'flex';
}

// ================= ADMIN NAVIGATION =================
function showAdminSection(sectionId){
  document.querySelectorAll('.adm-section').forEach(sec => sec.classList.remove('active'));
  document.getElementById('adm-section-' + sectionId).classList.add('active');

  document.querySelectorAll('.a-nav-item').forEach(i => i.classList.remove('active'));
  event.currentTarget.classList.add('active');
}

// ================= MOCK DATA LOADER =================
let adminData = {
  schools: [],
  students: []
};

async function loadAllAdminData(){
  // TODO: Replace with Supabase fetch
  console.log("Loading admin data...");

  // MOCK DATA
  adminData.schools = [
    {name:"ABC School", block:"Block 1", enrolled:200},
    {name:"XYZ School", block:"Block 2", enrolled:150}
  ];

  adminData.students = [
    {name:"Rahul", school:"ABC School", block:"Block 1", risk:"high", reason:"Absenteeism"},
    {name:"Sita", school:"XYZ School", block:"Block 2", risk:"medium", reason:"Family Issues"}
  ];

  renderAdminDashboard();
  renderRiskMap();
  renderSchoolCards();
  renderChildrenTable();
}

// ================= DASHBOARD =================
function renderAdminDashboard(){
  document.getElementById('ak-schools').innerText = adminData.schools.length;
  document.getElementById('ak-enrolled').innerText = adminData.schools.reduce((a,b)=>a+b.enrolled,0);
  document.getElementById('ak-atrisk').innerText = adminData.students.length;
}

// ================= RISK MAP =================
function renderRiskMap(){
  const grid = document.getElementById('risk-map-grid');
  grid.innerHTML = '';

  const blocks = {};
  adminData.students.forEach(s=>{
    if(!blocks[s.block]) blocks[s.block]=0;
    blocks[s.block]++;
  });

  Object.keys(blocks).forEach(b=>{
    const div = document.createElement('div');
    div.className = 'risk-tile high';
    div.innerHTML = `<div class="rt-block">${b}</div><div class="rt-nums"><span>${blocks[b]} at-risk</span></div>`;
    grid.appendChild(div);
  });
}

// ================= SCHOOL CARDS =================
function renderSchoolCards(){
  const grid = document.getElementById('school-cards-grid');
  if(!grid) return;
  grid.innerHTML = '';

  adminData.schools.forEach(s=>{
    const card = document.createElement('div');
    card.className = 'sc-card';
    card.innerHTML = `
      <div class="sc-card-top">
        <div class="sc-card-name">${s.name}</div>
        <div class="sc-card-meta">${s.block}</div>
      </div>
      <div class="sc-card-body">
        <div>Enrolled: ${s.enrolled}</div>
      </div>`;
    grid.appendChild(card);
  });
}

// ================= CHILDREN TABLE =================
function renderChildrenTable(){
  const tbody = document.getElementById('children-tbody');
  if(!tbody) return;
  tbody.innerHTML = '';

  adminData.students.forEach((s,i)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${i+1}</td>
      <td>${s.name}</td>
      <td>${s.school}</td>
      <td>${s.block}</td>
      <td>-</td>
      <td>-</td>
      <td>${s.reason}</td>
      <td>-</td>
      <td>-</td>
      <td><span class="badge badge-adm-red">At-Risk</span></td>
      <td>${s.risk}</td>`;
    tbody.appendChild(tr);
  });
}
</script>
